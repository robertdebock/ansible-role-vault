---
galaxy_info:
  author: robertdebock
  role_name: vault
  description: Install Hashicorp Vault, either a package or a binary.
  license: Apache-2.0
  company: none
  min_ansible_version: "2.20"

  platforms:
    - name: Debian
      versions:
        - all
    - name: EL
      versions:
        - "9"
    - name: Fedora
      versions:
        # HashiCorp does not publish packages for rawhide or the very latest Fedora.
        - "44"
    - name: Ubuntu
      versions:
        - noble
        - jammy

  galaxy_tags:
    - vault
    - hashicorp
    - security

dependencies: []
